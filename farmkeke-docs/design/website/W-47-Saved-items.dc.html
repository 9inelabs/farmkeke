<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farmkeke — saved items</title>

<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Montserrat:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F4F5F1}
*{box-sizing:border-box}
a{color:#1E3B16;text-decoration:none}
.fk{font-family:Inter,system-ui,sans-serif;color:#1A1A1A;background:#F4F5F1;-webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.h1{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:28px;line-height:36px;letter-spacing:-0.02em;margin:0}
.p{font-size:15px;line-height:24px;color:#5A5E56;margin:0}
.card{background:#FFFFFF;border-radius:18px;box-shadow:inset 0 0 0 1px #E6E8E2}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:11px;font-weight:600;font-size:14px;border:0;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:10px}
.lime{background:#A9D654;color:#1A1A1A}
.ghost{background:#FFFFFF;color:#1A1A1A;box-shadow:inset 0 0 0 1px #D9DCD3}
.dark{background:#1E3B16;color:#FFFFFF}
.top{background:#FFFFFF;box-shadow:inset 0 -1px 0 #E6E8E2}
.toprow{display:flex;align-items:center;gap:16px;height:76px}
.search{flex:1;display:flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 16px;border-radius:12px;background:#F4F5F1;box-shadow:inset 0 0 0 1px #E2E5DC;color:#8A8E85;font-size:15px}
.hlink{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 10px;border-radius:10px;color:#1A1A1A;font-size:14px;font-weight:500;white-space:nowrap}
.me{width:30px;height:30px;border-radius:999px;background:#E4F2C7;color:#1E3B16;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.acc{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
.nav{padding:10px;display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border-radius:10px;color:#3B3F38;font-size:14px;font-weight:500}
.nav a.on{background:#F2F8E6;color:#1E3B16;font-weight:600}
.nav hr{border:0;height:1px;background:#EEF0EB;margin:8px 4px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.pc{background:#FFFFFF;border-radius:16px;box-shadow:inset 0 0 0 1px #E6E8E2;padding:10px;display:flex;flex-direction:column;gap:10px}
.pimg{aspect-ratio:4/3;border-radius:11px;position:relative;display:flex;align-items:center;justify-content:center;color:rgba(30,59,22,0.32)}
.tag{position:absolute;left:8px;top:8px;display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:7px;font-size:12px;font-weight:600;background:#FFFFFF}
.heart{position:absolute;right:8px;top:8px;width:34px;height:34px;border-radius:999px;background:#FFFFFF;border:0;display:flex;align-items:center;justify-content:center;cursor:pointer}
.price{font-family:Montserrat,system-ui,sans-serif;font-weight:800;font-size:17px;color:#1E3B16}
.unit{font-family:Inter,system-ui,sans-serif;font-weight:500;font-size:12px;color:#7A7E75}
@media (max-width:760px){.wrap{padding:0 16px}.acc{grid-template-columns:minmax(0,1fr)}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.toprow{flex-wrap:wrap;height:auto;padding:12px 0}.search{order:3;flex-basis:100%}}
</style>
</helmet>

<div class="wrap toprow">

<a href="W-45-Profile.dc.html"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>Profile and login</a>

<a href="#help"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path><path d="M12 17h.01"></path></svg>Help and support</a>

</nav>

<div style="font-size: 12px; color: #6B6F66">{{p.farm}}</div>
<div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px"><div class="price">{{p.price}} <span class="unit">/ {{p.unit}}</span></div><button class="{{p.btnCls}}" type="button">{{p.btn}}</button></div>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Farmkeke — landing page on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Montserrat:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; font-family: Inter, system-ui, sans-serif; color: #1A1A1A; background: #F4F5F1">
<dc-import name="Main" platform="android" stores-live="{{live}}" hint-size="100%,10800px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":10800}}'>
class Component extends DCLogic {
  renderVals() {
    return { live: true };
  }
}
</script>
</body>
</html>

.fl{display:flex;flex-direction:column;gap:12px}

.crumb{display:flex;align-items:center;gap:6px;font-size:13px;color:#7A7E75}
.crumb a{color:#5A5E56}
.navmenu{display:none}
@media (max-width:760px){

.h1{font-size:36px;line-height:44px}

.lead{font-size:16px;line-height:26px}
.sec{padding:64px 0 0}
.navlinks,.navshop{display:none}
.navmenu{display:inline-flex}
.g2,.g3,.g4{grid-template-columns:minmax(0,1fr)}

.gfoot>div:first-child{grid-column:1/-1}

.hide-m{display:none}

.hl{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 10px;border-radius:10px;color:#1A1A1A;font-size:14px;font-weight:500;white-space:nowrap}

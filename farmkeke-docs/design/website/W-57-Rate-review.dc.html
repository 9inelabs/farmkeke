<style>

.tag.on{background:#1E3B16;color:#FFFFFF;box-shadow:none}
.pr{display:flex;gap:12px;align-items:center;padding:12px 0}.pr+.pr{box-shadow:inset 0 1px 0 #EEF0EB}
.hlink{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 10px;border-radius:10px;color:#1A1A1A;font-size:14px;font-weight:500;white-space:nowrap}
.me{width:30px;height:30px;border-radius:999px;background:#E4F2C7;color:#1E3B16;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
</style>

<div style="min-height: 1150px; background: #F4F5F1; font-family: Inter, system-ui, sans-serif; color: #1A1A1A">

<main style="max-width: 640px; margin: 0 auto; padding: 32px 20px">
<a href="W-44-My-orders.dc.html" style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>My orders</a>
<section class="card" style="padding: 32px; margin-top: 14px">
<div style="display: flex; gap: 14px; align-items: center"><span style="width: 52px; height: 52px; border-radius: 999px; background: #E4F2C7; color: #1E3B16; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; flex: none">OF</span><div><div style="font-size: 13px; color: #6B6F66">Order FK-10234 · Delivered Sun 18 Oct</div><h1 style="margin: 2px 0 0; font-family: Montserrat, sans-serif; font-weight: 800; font-size: 24px; line-height: 32px">How was Okafor Farms?</h1></div></div>
<div style="margin-top: 24px">
<div style="display: flex; gap: 8px" role="radiogroup" aria-label="Rating">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="5">
<button class="star" type="button" role="radio" aria-checked="{{s.checked}}" aria-label="{{s.label}}" onClick="{{s.pick}}"><svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="{{s.fill}}" stroke="{{s.stroke}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg></button>
</sc-for>
</div>
<div style="font-weight: 600; font-size: 15px; margin-top: 10px; color: #1E3B16">{{word}}</div>
</div>
<div style="margin-top: 24px">
<div style="font-weight: 600; font-size: 14px">What stood out?</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px">
<sc-for list="{{tags}}" as="t" hint-placeholder-count="6">
<button class="{{t.cls}}" type="button" aria-pressed="{{t.pressed}}" onClick="{{t.toggle}}">{{t.name}}</button>
</sc-for>
</div>
</div>
<div style="margin-top: 24px">
<div style="font-weight: 600; font-size: 14px">Rate each item <span style="font-weight: 500; color: #7A7E75">(optional)</span></div>
<div style="margin-top: 6px">
<div class="pr"><span style="width: 44px; height: 44px; border-radius: 10px; background: #F6E3DC; flex: none"></span><span style="flex: 1; font-weight: 600; font-size: 14px">Fresh tomatoes</span><span style="color: #E6A23C; font-size: 18px; letter-spacing: 3px" aria-label="4 stars">★★★★<span style="color: #D6DAD0">★</span></span></div>
<div class="pr"><span style="width: 44px; height: 44px; border-radius: 10px; background: #F7E0D6; flex: none"></span><span style="flex: 1; font-weight: 600; font-size: 14px">Scotch bonnet pepper</span><span style="color: #E6A23C; font-size: 18px; letter-spacing: 3px" aria-label="5 stars">★★★★★</span></div>
</div>
</div>
<label style="display: block; margin-top: 22px"><span style="display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px">Tell other shoppers more <span style="font-weight: 500; color: #7A7E75">(optional)</span></span><textarea rows="3" placeholder="What did you like? What could be better?" style="width: 100%; border-radius: 12px; box-shadow: inset 0 0 0 1px #DCE0D6; border: 0; padding: 14px; font: inherit; font-size: 15px; resize: none"></textarea></label>
<div style="display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 22px"><a class="btn ghost" href="W-44-My-orders.dc.html">Not now</a><a class="btn lime" href="W-44-My-orders.dc.html">Post review</a></div>
<p style="margin: 14px 0 0; font-size: 12px; line-height: 17px; color: #7A7E75; text-align: center">Your review shows with your first name and initial, like "Adaeze N."</p>
</section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1150}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { rating: 4, tags: { 'Fresh': true, 'Well packed': false, 'On time': true, 'Good value': false, 'Friendly farmer': true, 'As described': false } };
  }
  renderVals() {
    const words = ['', 'Poor', 'Not great', 'Okay', 'Good', 'Excellent'];
    const r = this.state.rating;
    return {
      word: words[r],
      stars: [1, 2, 3, 4, 5].map((n) => ({
        label: n + (n === 1 ? ' star' : ' stars'),
        checked: n === r ? 'true' : 'false',
        fill: n <= r ? '#E6A23C' : 'none',
        stroke: n <= r ? '#E6A23C' : '#C9CEC2',
        pick: () => this.setState({ rating: n })
      })),
      tags: Object.keys(this.state.tags).map((k) => ({
        name: k,
        cls: this.state.tags[k] ? 'tag on' : 'tag',
        pressed: this.state.tags[k] ? 'true' : 'false',
        toggle: () => this.setState({ tags: Object.assign({}, this.state.tags, { [k]: !this.state.tags[k] }) })
      }))
    };
  }
}
</script>
</body>

<p style="margin: 8px 0 0; font-size: 15px; line-height: 24px; color: #5A5E56">For adaeze@example.com. Choose one you haven't used on Farmkeke before.</p>

</span></label>

<p style="margin: 16px 0 0; font-size: 13px; line-height: 19px; color: #7A7E75">You'll be signed out on other devices. The Farmkeke app uses this same password.</p>
